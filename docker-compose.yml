version: '3'
services:
  sigcap-frontend:
    build:
      context: sigcap-frontend/.
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - API_TABLERO_URL:$API_TABLERO_URL
      - API_GLOBAL_URL:$API_GLOBAL_URL
      - URI_PLANILLA_CONTROL:$URI_PLANILLA_CONTROL
      - URI_CUPONERA:$URI_CUPONERA

    image: ${APP_NAME}-frontend
    container_name: ${APP_NAME}-frontend
#    volumes:
#      - ./frontend:/app/${APP_NAME}-fe
    ports:
      - $FRONTEND_LOCAL_PORT:$FRONTEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network

  sigcap-backend:
    build:
      context: sigcap-backend/.
      dockerfile: Dockerfile.desarrollo
    env_file:
      - .env
    environment:
      - FRONTEND_URL:$FRONTEND_URL
      - DB_HOST:$DB_HOST
      - DB_PORT:$DB_PORT
      - DB_NAME:$DB_NAME
      - DB_USER:$DB_USER
      - DB_PASSWORD:$DB_PASSWORD
      
    image: ${APP_NAME}-backend
    container_name: ${APP_NAME}-backend
    volumes:
      - ./sigcap-backend:/app/sigcap
    ports:
      - $BACKEND_LOCAL_PORT:$BACKEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network

  sigcap-pgadmin:
    build:
      context: ./sigcap-db/sigcap-pgadmin
    container_name: ${APP_NAME}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - $PGADMIN_LOCAL_PORT:$PGADMIN_DOCKER_PORT
    networks:
      - network

  sigcap-postgres:
    build:
      context: ./sigcap-db/sigcap-postgres
    container_name: ${APP_NAME}-postgres
    environment:
      DB_HOST: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - $DB_LOCAL_PORT:$DB_DOCKER_PORT
    networks:
      - network

networks:
  network: # Define la red ${APP_NAME}-network
    driver: bridge # Utiliza el driver de red 'bridge' por defecto
